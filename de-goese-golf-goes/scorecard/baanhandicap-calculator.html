        }

        }
        .bhcp_knoppen_rij_extra_optie{
            display: none;
        }
        .bhcp_knop{
            height: 50px;
            border-radius: 5px;
            color: #fff;
            font-size: 16px;
            text-align: center;
            padding: 15px 0;
            width: calc(50% - 23px);
            margin-left: 20px;
            display: inline-block;
            margin-right: -15px;
            cursor:pointer;
        }
        .bhcp_actieve_rij .bhcp_knop{
            height: 56px;
            border-radius: 0;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(2px);
            padding: 20px 0;
            width: calc(50% - 2px);
            margin: 0;
            margin-right: 4px;
        }
        .bhcp_knoppen_rij_3knoppen .bhcp_knop{
            width:calc(33.333% - 17px);
        }

            width:calc(33.333% - 2.75px);
        }

        }
        .bhcp_actieve_rij .bhcp_knop:last-child{
            margin:0;
        }

        var huidig;
        function tel_naar_getal(doel,$dom){
            var tijdsduur = 20000;
            huidig =  parseInt($dom.html());
            var verschil = Math.abs(doel - huidig);
            var stap = 1;
            if(doel - huidig < 0){
                stap = -1;
            }
            verander_getal(stap, doel, $dom, Math.round(tijdsduur/verschil));
        }
        function verander_getal(stap, doel, $dom, snelheid) {
            huidig = huidig + stap;
            $dom.html(huidig);
            if(huidig < doel && stap > 0 ||  huidig > doel && stap < 0) {
                setTimeout(function() {verander_getal(stap, doel, $dom)}, snelheid);
            }
        }
