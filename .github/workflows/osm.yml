name: OpenStreetMap ophalen

# Met de hand starten: haalt holes (tee, green, par) van een golfbaan uit OpenStreetMap.
# Het resultaat staat in de log en als download (artifact) bij de run.
on:
  workflow_dispatch:
    inputs:
      lat: { description: 'Breedtegraad', required: false, default: '52.53' }
      lon: { description: 'Lengtegraad', required: false, default: '6.44' }
      radius: { description: 'Straal in meters', required: false, default: '5000' }
      name: { description: 'Of: naam van de baan', required: false, default: '' }
      region: { description: 'Alle banen in de straal (ja/nee)', required: false, default: 'nee' }

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Ophalen
        env:
          LAT: ${{ inputs.lat }}
          LON: ${{ inputs.lon }}
          RADIUS: ${{ inputs.radius }}
          OVERPASS_TIMEOUT_MS: "200000"
          NAME: ${{ inputs.name }}
          REGION: ${{ inputs.region }}
        run: |
          if [ "$REGION" = "ja" ]; then node tools/osm-region.mjs --lat "$LAT" --lon "$LON" --radius "$RADIUS" > osm.json
          elif [ -n "$NAME" ]; then node tools/osm-fetch.mjs --name "$NAME" > osm.json
          else node tools/osm-fetch.mjs --lat "$LAT" --lon "$LON" --radius "$RADIUS" > osm.json; fi
          head -c 2000 osm.json; echo
      - name: Op branch 'osm-data' zetten
        run: |
          mkdir /tmp/osm && cp osm.json "/tmp/osm/osm-$(date -u +%Y%m%d-%H%M%S).json" && cp osm.json /tmp/osm/laatste.json
          cd /tmp/osm
          git init -q -b osm-data
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "OSM ${{ inputs.lat }},${{ inputs.lon }} r=${{ inputs.radius }} ${{ inputs.name }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" osm-data
      - uses: actions/upload-artifact@v4
        with:
          name: osm
          path: osm.json
