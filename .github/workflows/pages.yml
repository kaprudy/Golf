name: Test en publiceer

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # De app in een echte browser: ronde starten (baan, holes, spelers). Faalt dit, dan geen deploy.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  deploy:
    # Publiceer vanaf de standaardbranch van de repository (wat die ook is).
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4

  server:
    # Server op golf.kapital.nl bijwerken. De sleutel mag op de server alleen deploy.sh draaien
    # (zie server/README.md, "Automatisch uitrollen"). Zonder ingestelde secrets wordt dit overgeslagen.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: test
    runs-on: ubuntu-latest
    concurrency: server-deploy
    env:
      HOST: ${{ secrets.DEPLOY_HOST }}
    steps:
      - name: Uitrollen
        if: env.HOST != ''
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          USER: ${{ secrets.DEPLOY_USER }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy -o StrictHostKeyChecking=yes -o BatchMode=yes "${USER:-root}@$HOST" "$GITHUB_SHA"
      - name: Controleren
        if: env.HOST != ''
        run: |
          for i in 1 2 3 4 5 6; do
            curl -fsS https://golf.kapital.nl/api/health && exit 0
            sleep 5
          done
          exit 1
      - name: Overgeslagen
        if: env.HOST == ''
        run: echo "Geen DEPLOY_HOST ingesteld; server niet bijgewerkt."
