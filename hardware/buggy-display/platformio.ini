; Golfscore buggy-scherm: firmware voor M5Stack-apparaten.
; Bouwen en flashen:  pio run -e coreink -t upload   (of -e core2)
; M5Unified herkent het apparaat zelf; dezelfde code werkt op beide.

[env]
platform = espressif32@6.9.0
framework = arduino
monitor_speed = 115200
lib_deps =
  m5stack/M5Unified@0.2.10
  h2zero/NimBLE-Arduino@2.3.9
  bblanchon/ArduinoJson@7.4.2

; M5Stack CoreInk: e-ink, goed leesbaar in de zon, fysieke knoppen (aanbevolen)
[env:coreink]
board = m5stack-coreink

; M5Stack Core2: kleurenscherm met aanraken, groter maar minder goed leesbaar in de zon
[env:core2]
board = m5stack-core2
