# Variant C: achter Nginx Proxy Manager (NPM). Deze kleine nginx toont de infopagina en stuurt
# /api/ door naar de API-container. NPM regelt HTTPS en stuurt golf.kapital.nl hierheen.
server {
    listen 80;
    server_name _;

    # Het echte IP-adres van de bezoeker komt van NPM (voor de beperking op inlogpogingen).
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Real-IP;

    root /srv/site;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    # OpenStreetMap opvragen kan even duren (de server probeert een paar Overpass-servers).
    location /api/osm/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 120s;
    }

    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        client_max_body_size 2m;
    }

    # Banenlijst rechtstreeks uit de app (zelfde versie als de uitgerolde code)
    location = /data/courses.js {
        alias /srv/app/courses.js;
        default_type text/javascript;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
