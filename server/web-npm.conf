# Variant C: achter Nginx Proxy Manager (NPM). Deze kleine nginx toont de infopagina en stuurt
# /api/ door naar de API-container. NPM regelt HTTPS en stuurt golf.kapital.nl hierheen.
server {
    listen 80;
    server_name _;

    # Het echte IP-adres van de bezoeker komt van NPM (voor de beperking op inlogpogingen).
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Real-IP;

    root /srv/site;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        client_max_body_size 2m;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
