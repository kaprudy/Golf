# Variant B: golf.kapital.nl achter een bestaande nginx.
# Zet dit bestand in /etc/nginx/sites-available/, link het naar sites-enabled,
# en vraag een certificaat aan met:  certbot --nginx -d golf.kapital.nl
# Pas het pad naar de map 'site' aan naar waar je de repository hebt staan.

server {
    listen 80;
    server_name golf.kapital.nl;

    root /opt/golf/server/site;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    location /api/ {
        proxy_pass http://127.0.0.1:3080;
        proxy_set_header Host $host;
        # Alleen het echte IP-adres doorgeven (niet wat de browser zelf meestuurt)
        proxy_set_header X-Forwarded-For $remote_addr;
        client_max_body_size 2m;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
