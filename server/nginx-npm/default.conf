# Variant C: achter Nginx Proxy Manager (NPM), gekoppeld als map (zie docker-compose.npm.yml). Deze kleine nginx toont de infopagina en stuurt
# /api/ door naar de API-container. NPM regelt HTTPS en stuurt golf.kapital.nl hierheen.
server {
    listen 80;
    server_name _;

    # Het echte IP-adres van de bezoeker komt van NPM (voor de beperking op inlogpogingen).
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Real-IP;

    root /srv/site;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # Openbare pagina's: inline scripts (gegenereerde pagina's), maar niets van andere sites.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # OpenStreetMap opvragen kan even duren (de server probeert een paar Overpass-servers).
    location /api/osm/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 120s;
    }

    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        client_max_body_size 2m;
    }

    # Banenlijst rechtstreeks uit de app (zelfde versie als de uitgerolde code)
    location = /data/courses.js {
        alias /srv/app/courses.js;
        default_type text/javascript;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Beheerpagina: strenger, alleen eigen scripts en Leaflet (met SRI) van cdnjs. In nginx vervangt
    # add_header in een location alle headers van hierboven, dus hier de hele set.
    location = /admin.html {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://tile.openstreetmap.org https://cdnjs.cloudflare.com; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
