<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Golfscore beheer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"
    integrity="sha512-h9FcoyWjHcOcmEVkxOfTLnmZFWIH0iZhZT1H2TbOq55xssQGEJHEaIm+PgoUaZbRvQTNTluNOEfb1ZRy6D3BOw==" crossorigin="anonymous">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=DM+Sans:wght@400;500;600&display=swap">
  <style>
    :root {
      --accent: #1E4D36; --accent-ink: #1E4D36; --on-accent: #FBF8F1;
      --bg: #F4EEE2; --card: #FBF8F1; --sand: #E9DFCB; --border: #E2D7C1; --grid: #E9E1D0;
      --text: #1F2A22; --muted: #5C5A4E; --bad: #A4441F;
      --s-email: #1F7A4D; --s-anon: #B07A1A; /* gevalideerd tegen de kaartkleur (licht) */
      --serif: 'Fraunces', Georgia, serif; --sans: 'DM Sans', system-ui, sans-serif;
      color-scheme: light dark;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --accent: #2E6B4C; --accent-ink: #9CCDB0; --on-accent: #F4EEE2;
        --bg: #171A15; --card: #20241D; --sand: #2A2E25; --border: #353A2F; --grid: #2C3127;
        --text: #EFE9DC; --muted: #B3AC98; --bad: #E58A62;
        --s-email: #35A06A; --s-anon: #CC7F22; /* gevalideerd tegen de kaartkleur (donker) */
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 var(--sans); }
    main { max-width: 1080px; margin: 0 auto; padding: 24px 16px 48px; }
    h1, h2 { font-family: var(--serif); font-weight: 600; color: var(--accent-ink); line-height: 1.15; }
    h1 { font-size: 2rem; margin: 4px 0 4px; }
    h2 { font-size: 1.25rem; margin: 0 0 4px; }
    .overline { font-size: .72rem; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }
    .muted { color: var(--muted); } .small { font-size: .85rem; }
    .top { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
    button { font: inherit; min-height: 40px; padding: 0 16px; border-radius: 20px; border: 1px solid var(--border); background: var(--card); color: var(--text); cursor: pointer; }
    button.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-weight: 600; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 18px; margin: 16px 0; }
    .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin: 20px 0; }
    .tile { background: var(--card); border: 1px solid var(--border); border-radius: 18px; padding: 14px 16px; }
    .tile .label { font-size: .8rem; color: var(--muted); }
    .tile .value { font-family: var(--serif); font-size: 2rem; line-height: 1.1; color: var(--accent-ink); font-variant-numeric: tabular-nums; }
    .tile .sub { font-size: .8rem; color: var(--muted); }
    .two { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
    .two .card { margin: 0; }
    form.login { max-width: 380px; display: grid; gap: 12px; }
    label { display: grid; gap: 4px; font-size: .9rem; }
    input { font: inherit; min-height: 44px; padding: 0 12px; border-radius: 12px; border: 1px solid var(--border); background: var(--bg); color: var(--text); }
    .alert { border: 2px solid var(--bad); border-radius: 14px; padding: 12px 14px; color: var(--text); }
    .alert strong { color: var(--bad); }
    .scroll { overflow-x: auto; }
    table { border-collapse: collapse; width: 100%; font-size: .88rem; }
    th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
    th { font-weight: 600; color: var(--muted); font-size: .78rem; }
    td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
    td.text { white-space: normal; min-width: 220px; font-family: ui-monospace, Menlo, monospace; font-size: .82rem; }
    .pill { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: .75rem; background: var(--sand); }
    .pill.ok { background: var(--accent); color: var(--on-accent); }
    .diff { color: var(--bad); font-weight: 600; }
    /* grafiek */
    .chart { position: relative; }
    .bars { display: flex; align-items: flex-end; gap: 2px; height: 140px; border-bottom: 1px solid var(--border); }
    .col { flex: 1; height: 100%; display: flex; flex-direction: column-reverse; gap: 2px; cursor: default; }
    .col:hover { background: var(--grid); border-radius: 4px 4px 0 0; }
    .seg { width: 100%; }
    .seg.top { border-radius: 4px 4px 0 0; }
    .axis { display: flex; justify-content: space-between; font-size: .72rem; color: var(--muted); margin-top: 4px; }
    .legend { display: flex; gap: 14px; font-size: .8rem; color: var(--muted); margin: 6px 0 10px; }
    .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
    .tip { position: absolute; pointer-events: none; background: var(--text); color: var(--bg); font-size: .78rem; padding: 6px 9px; border-radius: 8px; white-space: nowrap; transform: translate(-50%, -110%); }
    .max { font-size: .72rem; color: var(--muted); }
    .map { height: 420px; border-radius: 14px; border: 1px solid var(--border); margin-top: 10px; z-index: 0; }
    .hole-label { background: none; border: 0; }
    .hole-label span { display: inline-block; min-width: 22px; padding: 1px 5px; border-radius: 11px; font: 600 11px/16px var(--sans); text-align: center; color: #fff; border: 2px solid #fff; }
    select { font: inherit; min-height: 40px; border-radius: 12px; border: 1px solid var(--border); background: var(--bg); color: var(--text); padding: 0 10px; }
  </style>
</head>
<body>
<main>
  <div class="top">
    <div>
      <div class="overline">Golfscore</div>
      <h1>Beheer</h1>
      <div class="muted small" id="stamp"></div>
    </div>
    <div id="actions" hidden><button id="refresh">Vernieuwen</button> <button id="logout">Uitloggen</button></div>
  </div>

  <section id="login" class="card" hidden>
    <h2>Inloggen</h2>
    <p class="muted small">Met je gewone Golfscore-account. Alleen accounts die op de server als beheerder zijn ingesteld (ADMIN_USER_IDS) krijgen toegang.</p>
    <form class="login" id="login-form">
      <label>E-mailadres <input id="email" type="email" autocomplete="email" required></label>
      <label>Wachtwoord <input id="password" type="password" autocomplete="current-password" required></label>
      <div id="login-error"></div>
      <button class="primary" type="submit">Inloggen</button>
    </form>
  </section>

  <div id="dash" hidden></div>
</main>
<script src="/admin.js"></script>
</body>
</html>
