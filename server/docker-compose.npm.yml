# Variant C – de server gebruikt Nginx Proxy Manager voor poort 80/443 (zoals kapital.nl):
#   NPM_NETWORK=<netwerk van NPM> docker compose -f docker-compose.yml -f docker-compose.npm.yml up -d --build
# Daarna in NPM een Proxy Host: golf.kapital.nl -> golf-web, poort 80, met SSL (Let's Encrypt).

services:
  web:
    image: nginx:1.27-alpine
    container_name: golf-web
    restart: unless-stopped
    volumes:
      - ./web-npm.conf:/etc/nginx/conf.d/default.conf:ro
      - ./site:/srv/site:ro
      # Banenlijst van de app (voor banen.html). De hele map, niet het losse bestand: git vervangt
      # courses.js bij elke deploy door een nieuw bestand, en een los gekoppeld bestand blijft dan oud.
      - ../js:/srv/app:ro
    networks: [default, npm]
    depends_on: [api]

networks:
  npm:
    external: true
    name: ${NPM_NETWORK:?zet NPM_NETWORK op het docker-netwerk van Nginx Proxy Manager}
